name: Dependency review

# What a pull request adds to the dependency graph (#16 A.5): a new dependency
# with a known high vulnerability, or under a licence outside the policy, fails
# here. It sees direct dependencies only: GitHub's graph of this repository is
# built from the package.json files (116 packages on 2026-09-20), not from
# pnpm-lock.yaml (1,372 installed). Everything a dependency brings with it is
# covered by the two checks that read the installed tree in ci.yml:
# `pnpm check:licenses` for licences and `pnpm audit` for vulnerabilities.

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency review
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: ./.github/dependency-review-config.yml
