name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.task }}
    # arm64 runners: free for public repositories, and the same architecture as the t4g box.
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        task: [typecheck, lint]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: ${{ matrix.task }}
        run: pnpm ${{ matrix.task }}

  test:
    name: test
    runs-on: ubuntu-24.04-arm
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kuutti
          POSTGRES_PASSWORD: kuutti
          POSTGRES_DB: kuutti_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kuutti"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://kuutti:kuutti@127.0.0.1:5432/kuutti_test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: test
        run: pnpm test

  contracts:
    name: contracts
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: OpenAPI document and generated types are committed and current
        run: |
          pnpm openapi
          git diff --exit-code -- apps/api/openapi.json packages/schema/src/api.generated.ts

      - name: Migrations match the schema
        run: |
          pnpm --filter @kuutti/db check
          pnpm --filter @kuutti/db generate --name ci-drift-check
          git diff --exit-code -- packages/db/drizzle
          test -z "$(git status --porcelain -- packages/db/drizzle)" || { git status --porcelain -- packages/db/drizzle; echo "schema changed without a committed migration"; exit 1; }

      - name: No forbidden identifiers in the schema
        run: pnpm check:schema-words

  compose:
    name: compose
    # The local stack as a developer runs it: Postgres, MinIO, the mock bank IdP.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Every published port binds to loopback
        run: |
          docker compose config --format json | python3 -c '
          import json, sys
          bad = [(n, p) for n, s in json.load(sys.stdin)["services"].items() for p in s.get("ports", []) if p.get("host_ip") != "127.0.0.1"]
          print("all published ports on 127.0.0.1" if not bad else f"not loopback: {bad}")
          sys.exit(1 if bad else 0)'

      - name: Start the stack
        run: |
          cp env.example .env
          docker compose up -d --wait
          docker compose ps

      - name: Mock bank IdP issues FTN-shaped claims
        run: node services/mock-idp/verify.ts

      - name: Migrate and seed against compose Postgres
        run: |
          pnpm --filter @kuutti/db migrate
          pnpm --filter @kuutti/db seed --env development

      - name: API and db tests against compose Postgres and MinIO
        env:
          DATABASE_URL: postgres://kuutti:kuutti@127.0.0.1:5432/kuutti_test
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_BUCKET: kuutti-media
          S3_ACCESS_KEY: kuutti
          S3_SECRET_KEY: kuutti-dev-only
        run: |
          pnpm --filter @kuutti/db test
          pnpm --filter @kuutti/api test

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -100

  docker-build:
    name: docker-build
    runs-on: ubuntu-24.04-arm
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kuutti
          POSTGRES_PASSWORD: kuutti
          POSTGRES_DB: kuutti
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kuutti"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the API image for linux/arm64
        run: |
          docker build --platform linux/arm64 \
            --build-arg APP_VERSION=0.0.0-ci \
            --build-arg GIT_COMMIT=${GITHUB_SHA::7} \
            --build-arg BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -f apps/api/Dockerfile -t kuutti-api:ci .

      - name: Image starts, migrates, and answers /health with db ok
        run: |
          docker run -d --name api --network host \
            -e APP_ENV=test \
            -e DATABASE_URL=postgres://kuutti:kuutti@127.0.0.1:5432/kuutti \
            kuutti-api:ci
          for i in $(seq 1 30); do
            if out=$(curl -fsS http://127.0.0.1:3000/health); then echo "$out"; echo "$out" | grep -q '"db":"ok"' && echo "$out" | grep -q '"migrations":"current"' && exit 0; fi
            sleep 1
          done
          echo "no healthy answer"; docker logs api; exit 1
