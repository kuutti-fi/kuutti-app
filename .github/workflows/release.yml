name: Release

# Called by build.yml on a v* tag: a draft release with notes generated from
# the commits since the previous tag, the image digest (#8) and where the
# production builds' links land (#10): the project's builds page on Expo, or
# the issue named by EAS_BUILDS_ISSUE when that variable is set.
# The maintainer reads the draft and publishes it.

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      image:
        description: Image reference by digest
        type: string
        required: true

permissions:
  contents: read

jobs:
  draft:
    name: draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          IMAGE: ${{ inputs.image }}
          BUILDS_ISSUE: ${{ vars.EAS_BUILDS_ISSUE }}
        run: |
          notes="API image: \`$IMAGE\`"
          if [ -n "$BUILDS_ISSUE" ]; then
            notes="$notes"$'\n'"Native builds: the \`production\` comment on #$BUILDS_ISSUE (eas-build.yml)."
          fi
          gh release create "$TAG" --draft --generate-notes --title "$TAG" --notes "$notes"
