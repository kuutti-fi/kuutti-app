name: Release

# Called by build.yml on a v* tag: a draft release with notes generated from
# the commits since the previous tag and the image digest (#8). EAS build
# links arrive with #10. The maintainer reads the draft and publishes it.

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      image:
        description: Image reference by digest
        type: string
        required: true

permissions:
  contents: read

jobs:
  draft:
    name: draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          IMAGE: ${{ inputs.image }}
        run: |
          gh release create "$TAG" --draft --generate-notes --title "$TAG" \
            --notes "API image: \`$IMAGE\`"
