name: Scorecard

# OpenSSF Scorecard (#16 A.6): checks most of the repository hardening
# continuously (pinned actions, token permissions, branch protection, dangerous
# workflow patterns, signed releases) and publishes the result that the README
# badge shows. Findings also land in the repository's code scanning alerts.

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Upload the findings as code scanning alerts.
      security-events: write
      # publish_results proves to the Scorecard API, with the job's OIDC token,
      # that the result comes from this repository.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: results.sarif
