name: Scenarios

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scenarios:
    name: scenarios
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # pnpm comes from the packageManager field via Corepack, hash-verified.
      # The checker has no dependencies, so there is nothing to install.
      - name: Enable pnpm
        run: corepack enable

      - name: Every non-pending scenario has a same-named test
        run: pnpm check:scenarios --list
