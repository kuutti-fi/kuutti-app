name: Deploy

# Called by build.yml: deploys an already-pushed image to one environment's
# Dokploy, waits until /health runs that commit (#8), then publishes the same
# commit's JavaScript as a signed EAS Update to the environment's channel
# (#10: staging or production). The GitHub environment supplies DOKPLOY_URL,
# DOKPLOY_APPLICATION_ID and API_URL as variables and DOKPLOY_TOKEN,
# EXPO_TOKEN and EXPO_UPDATES_PRIVATE_KEY as secrets; prod's environment
# also carries the reviewer gate, so a prod deploy waits for approval before
# this runs. EAS_ENABLED (repository variable) switches the update on.

on:
  workflow_call:
    inputs:
      environment:
        description: staging or prod
        type: string
        required: true
      image:
        description: Full image reference to deploy
        type: string
        required: true
      commit:
        description: Short commit /health must report
        type: string
        required: true

permissions:
  contents: read

# bash -eo pipefail: a failed eas or curl behind a pipe must fail the step.
defaults:
  run:
    shell: bash

env:
  EAS_CLI_VERSION: "24.3.0"

jobs:
  deploy:
    name: deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.API_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Point the Dokploy application at the image and deploy
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          DOKPLOY_APPLICATION_ID: ${{ vars.DOKPLOY_APPLICATION_ID }}
          IMAGE: ${{ inputs.image }}
        run: .github/scripts/dokploy-deploy.sh

      - name: /health reports the commit with the database reachable
        env:
          API_URL: ${{ vars.API_URL }}
          COMMIT: ${{ inputs.commit }}
        run: .github/scripts/wait-healthy.sh

      # The update follows the API (#10, ADR-004): staging gets channel
      # staging, prod channel production, each bundle pointed at its own API.
      # Signed with the key from the environment's secret; a client rejects
      # anything not signed by the certificate it ships with. A native change
      # is a build, not an update: eas-build.yml watches the fingerprint.
      - uses: ./.github/actions/pnpm
        if: vars.EAS_ENABLED == 'true'

      # The key exists in exactly one step's environment, this one, which runs
      # nothing but printf: the bundler and every dependency it loads run in
      # the next step, where the key is a file path and nothing else.
      - name: Write the update signing key
        if: vars.EAS_ENABLED == 'true'
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.EXPO_UPDATES_PRIVATE_KEY }}
        run: |
          : "${UPDATE_SIGNING_KEY:?set the secret EXPO_UPDATES_PRIVATE_KEY in this environment}"
          (umask 077 && printf '%s\n' "$UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/update-signing-key.pem")

      - name: Publish the signed EAS Update to the ${{ inputs.environment == 'prod' && 'production' || 'staging' }} channel
        if: vars.EAS_ENABLED == 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ vars.API_URL }}
          CHANNEL: ${{ inputs.environment == 'prod' && 'production' || 'staging' }}
          EAS_ENVIRONMENT: ${{ inputs.environment == 'prod' && 'production' || 'preview' }}
          COMMIT: ${{ inputs.commit }}
        run: |
          npx --yes "eas-cli@$EAS_CLI_VERSION" update --channel "$CHANNEL" --environment "$EAS_ENVIRONMENT" \
            --message "$COMMIT" --platform all --private-key-path "$RUNNER_TEMP/update-signing-key.pem" \
            --json --non-interactive \
            | jq -r '.[] | "\(.platform) \(.id) runtime \(.runtimeVersion) branch \(.branch)"'

      # The update's source maps, so Sentry symbolises the JavaScript it just
      # published (#11). dist is eas update's export directory. Skipped, not
      # failed, while the environment has no token: the update is already out.
      - name: Upload the update's source maps to Sentry
        if: vars.EAS_ENABLED == 'true'
        working-directory: apps/mobile
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "SENTRY_AUTH_TOKEN is not set in this environment; source maps not uploaded"
            exit 0
          fi
          pnpm exec sentry-expo-upload-sourcemaps dist

      - name: Remove the signing key file
        if: always()
        run: rm -f "$RUNNER_TEMP/update-signing-key.pem"
