name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly full-history scan, Monday 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Least privilege: the job only needs to read the repository contents.
permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the scanner can inspect every commit in the range.
          fetch-depth: 0

      - name: Scan for leaked secrets
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          # Fail on secrets that verify against their provider, and on ones
          # that could not be verified either way. Ignore known-revoked ones.
          extra_args: --results=verified,unknown
