version: 2
updates:
  # Keep the actions used in .github/workflows current. Actions are pinned to
  # commit SHAs; Dependabot bumps the SHA and the version comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  # When a package manifest lands (package.json, go.mod, pyproject.toml, ...),
  # add its ecosystem here so dependency updates are proposed automatically:
