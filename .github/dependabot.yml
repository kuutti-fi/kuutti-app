version: 2
updates:
  # Keep the actions used in .github/workflows current. Actions are pinned to
  # commit SHAs; Dependabot bumps the SHA and the version comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  # The pnpm workspace. Minor and patch bumps arrive as one pull request a
  # week; majors come alone so they get read.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # The API image's base image (apps/api/Dockerfile). Node 22 is the
  # project's engine (package.json), and newer Node images drop Corepack, so
  # major bumps are a deliberate change, never a Dependabot pull request.
  - package-ecosystem: "docker"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # Provider version bumps for the infrastructure code, one per root with a
  # lockfile.
  - package-ecosystem: "terraform"
    directories: ["/infra/bootstrap", "/infra/envs/staging", "/infra/envs/prod"]
    schedule:
      interval: "weekly"
    groups:
      providers:
        patterns: ["*"]
