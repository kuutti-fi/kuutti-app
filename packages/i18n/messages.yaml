  description: Smoke screen, App card. Which update the phone is running. {id} is the first eight characters of the EAS Update id (a code, not translated); {date} is the update's publish time.
  fi: "päivitys {id}, julkaistu {date, date, short} {date, time, short}"
  sv: "uppdatering {id}, publicerad {date, date, short} {date, time, short}"
  machine: { fi: true, sv: true }

smoke.app.embedded:
  en: code from the build, no update applied
  description: Smoke screen, App card, when the phone runs the JavaScript embedded in the build rather than a downloaded update.
  fi: koodi rakennuksesta, päivitystä ei ole otettu käyttöön
