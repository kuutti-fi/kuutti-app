# Source of truth for every user-facing string in app, API and admin (#13, TD-17).
#
#   some.semantic.key:
#     en: English text, ICU MessageFormat ({name}, {count, plural, one {#} other {#}})
#     description: what it is and where it shows, for translators and reviewers
#     fi: Finnish (required: CI fails without it, except under admin.*)
#     sv: Swedish (CI warns without it)
#     machine: { fi: true, sv: true }   # set by `pnpm i18n:translate`, cleared by a
#                                       # native reviewer; a release tag refuses fi: true
#
# Never inflect a dynamic value: proper nouns and user values stand in nominative
# positions only ("in {pond}" is banned; ponds carry their case forms in the
# database). legal.* keys take a consent_version and never a machine flag.
# After editing: `pnpm i18n:build`, and commit src/generated with it.

smoke.title:
  en: Kuutti
  description: App name as the heading of the smoke screen. Never translated.
  fi: Kuutti
  sv: Kuutti

smoke.loading:
  en: Reaching the API…
  description: Smoke screen, shown while the first request to the API is in flight.
  fi: Yhdistetään rajapintaan…
  sv: Ansluter till API:et…
  machine: { fi: true, sv: true }

smoke.status.label:
  en: API status
  description: Smoke screen, screen-reader label of the card that shows the API's version.
  fi: Rajapinnan tila
  sv: API-status
  machine: { fi: true, sv: true }

smoke.api.title:
  en: API
  description: Smoke screen, title of the card about the API the app talks to. Never translated.
  fi: API
  sv: API

smoke.status.version:
  en: version {version}
  description: Smoke screen, under the API card's title. {version} is a version string such as 0.0.0-2b846b9.
  fi: versio {version}
  sv: version {version}
  machine: { fi: true, sv: true }

smoke.status.commit:
  en: git commit {commit}
  description: Smoke screen, in both cards. {commit} is a short git hash (a code, not translated); the card title says whose it is, the API's or the app's.
  fi: git-commit {commit}
  sv: git-commit {commit}
  machine: { fi: true, sv: true }

smoke.app.title:
  en: App
  description: Smoke screen, title of the card about the JavaScript this phone is running, as opposed to the API.
  fi: Sovellus
  sv: Appen
  machine: { fi: true, sv: true }

smoke.app.version:
  en: "version {version}, build {build}"
  description: Smoke screen, under the App card's title. {version} is the app's version string (0.0.0), {build} its native build number; both are codes.
  fi: "versio {version}, rakennus {build}"
  sv: "version {version}, bygge {build}"
  machine: { fi: true, sv: true }

smoke.app.label:
  en: App version
  description: Smoke screen, screen-reader label of the card that shows the app's own commit and update.
  fi: Sovelluksen versio
  sv: Appens version
  machine: { fi: true, sv: true }

smoke.app.noCommit:
