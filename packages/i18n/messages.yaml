# Source of truth for every user-facing string in app, API and admin (#13, TD-17).
#
#   some.semantic.key:
#     en: English text, ICU MessageFormat ({name}, {count, plural, one {#} other {#}})
#     description: what it is and where it shows, for translators and reviewers
#     fi: Finnish (required: CI fails without it, except under admin.*)
#     sv: Swedish (CI warns without it)
#     machine: { fi: true, sv: true }   # set by `pnpm i18n:translate`, cleared by a
#                                       # native reviewer; a release tag refuses fi: true
#
# Never inflect a dynamic value: proper nouns and user values stand in nominative
# positions only ("in {pond}" is banned; ponds carry their case forms in the
# database). legal.* keys take a consent_version and never a machine flag.
# After editing: `pnpm i18n:build`, and commit src/generated with it.

