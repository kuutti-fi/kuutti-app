  description: Smoke screen, App card, when the running code was built before the commit was stamped into it.
  fi: git-committia ei ole tallennettu tähän rakennukseen
  sv: git-commit inte registrerad i det här bygget
  machine: { fi: true, sv: true }

smoke.app.web:
  en: web version of the app, no updates
  description: Smoke screen, App card, on the web target (pull-request previews and local development); updates exist only on phones.
  fi: sovelluksen verkkoversio, ei päivityksiä
  sv: webbversion av appen, inga uppdateringar
  machine: { fi: true, sv: true }

smoke.app.dev:
  en: development server, no updates
  description: Smoke screen, App card, in a Metro session, where updates are disabled.
  fi: kehityspalvelin, ei päivityksiä
  sv: utvecklingsserver, inga uppdateringar
  machine: { fi: true, sv: true }

smoke.status.database:
