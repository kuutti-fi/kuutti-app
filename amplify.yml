# Amplify Hosting build spec for the placeholder page (ADR-001, 2026-09-18).
# The app is connected to this repository as a monorepo with root `site`, so
# a push to main deploys only when something under site/ changed. There is
# nothing to build: the folder is served as it is.
version: 1
applications:
  - appRoot: site
    frontend:
      phases:
        build:
          commands: []
      artifacts:
        baseDirectory: .
        files:
          - "**/*"
